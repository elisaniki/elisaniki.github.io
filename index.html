<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linden Park · Jesolo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800;9..144,900&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3e4;--card:#fffaf0;--tx:#0e3b43;--mut:#5f7a7d;--bd:#ecdcc0;--sea:#0e3b43;--sun:#ffc93c;--cor:#ff6b4a;--c1:#ff6b4a;--c2:#1f8a8a;--c3:#ffc93c;--c4:#86d9cb;--c5:#2d5f9a;--c6:#f4a0b0;--on1:#fff;--on2:#fff;--on3:#0e3b43;--on4:#0e3b43;--on5:#fff;--on6:#0e3b43;--hd:Fraunces,Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1d22;--card:#12303a;--tx:#fff4e2;--mut:#9db8bb;--bd:#24464f}}
:root[data-theme="dark"]{--bg:#0a1d22;--card:#12303a;--tx:#fff4e2;--mut:#9db8bb;--bd:#24464f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Figtree,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}
main{max-width:520px;margin:0 auto;padding:0 18px 48px}
.hero{position:relative;margin:18px 0 0;padding-top:34px}
.sun{position:absolute;right:6px;top:0;width:96px;height:96px;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
.sun:before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--sun);box-shadow:0 0 0 10px rgba(255,201,60,.28),0 0 0 22px rgba(255,201,60,.14)}
.sun i{position:absolute;inset:-26px;border-radius:50%;background:repeating-conic-gradient(var(--sun) 0 6deg,transparent 6deg 30deg);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%,#000 72%,transparent 74%);mask:radial-gradient(circle,transparent 58%,#000 60%,#000 72%,transparent 74%);animation:spin 40s linear infinite}
.arch{position:relative;z-index:1;border-radius:200px 200px 22px 22px;overflow:hidden;border:5px solid var(--card);box-shadow:0 14px 30px -12px rgba(14,59,67,.55);margin-top:22px;transform:rotate(-1.2deg)}
.arch img{display:block;width:100%;height:200px;object-fit:cover}
.stk{position:absolute;z-index:2;left:-4px;bottom:-14px;background:var(--cor);color:#fff;font-weight:700;font-size:13px;padding:7px 14px;border-radius:20px;transform:rotate(-3deg);box-shadow:0 6px 12px -6px rgba(0,0,0,.5)}
.ttl{font:900 clamp(40px,12vw,56px)/1 var(--hd);margin:34px 0 8px;letter-spacing:-.02em;min-height:1.05em}
.ttl.in{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.sub{color:var(--mut);margin:0 0 20px;font-size:17px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lg{display:flex;align-items:center;gap:10px;border:2px solid var(--tx);border-radius:40px;background:var(--card);color:var(--tx);font:700 17px Figtree,system-ui,sans-serif;padding:12px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--tx);transition:transform .12s,box-shadow .12s}
.lg:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--tx)}
.lg .f{font-size:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:26px;padding:18px 14px;text-align:left;font:inherit;cursor:pointer;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s;box-shadow:0 8px 16px -10px rgba(14,59,67,.6)}
.tile:active{transform:scale(.96) rotate(-1deg)}
.tile .ic{font-size:34px;line-height:1}
.tile .l{font:800 18px/1.15 var(--hd)}
.tile.wide{grid-column:1/3;flex-direction:row;align-items:center;min-height:96px}
.tile.wide .ic{font-size:44px}.tile.wide .l{font-size:24px}
.t1{background:var(--c1);color:var(--on1)}.t2{background:var(--c2);color:var(--on2)}.t3{background:var(--c3);color:var(--on3)}.t4{background:var(--c4);color:var(--on4)}.t5{background:var(--c5);color:var(--on5)}.t6{background:var(--c6);color:var(--on6)}
.back{background:none;border:0;color:var(--tx);font:700 15px Figtree,sans-serif;padding:16px 0 10px;cursor:pointer;opacity:.8}
.sh{display:flex;align-items:center;gap:14px;border-radius:26px;padding:16px 18px;margin-bottom:18px}
.sh span{font-size:38px}.sh h2{font:900 26px/1.1 var(--hd);margin:0}
.card{background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:16px}
.card h3{margin:0 0 8px;font:800 19px/1.2 var(--hd);display:flex;align-items:center;gap:10px}
.n{background:var(--tx);color:var(--bg);border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font:800 15px Figtree,sans-serif;flex:none}
.card p{margin:0 0 12px}
.pol{width:100%;display:block;margin-top:8px;border:6px solid #fff;border-bottom-width:16px;border-radius:6px;box-shadow:0 8px 16px -8px rgba(0,0,0,.45);transform:rotate(-1.4deg)}
.card:nth-of-type(even) .pol{transform:rotate(1.2deg)}
.cta{display:inline-block;background:var(--cor);color:#fff;text-decoration:none;font-weight:700;border-radius:30px;padding:12px 20px;font-size:15px;margin:2px 0 8px;box-shadow:3px 3px 0 var(--tx)}
.rule{border-radius:20px;padding:14px 16px;margin-bottom:12px}
.rule b{display:block;font:800 17px var(--hd);margin-bottom:2px}
.rule:nth-child(6n+1){background:var(--c3);color:#0e3b43}.rule:nth-child(6n+2){background:var(--c4);color:#0e3b43}.rule:nth-child(6n+3){background:var(--c6);color:#0e3b43}.rule:nth-child(6n+4){background:var(--c1);color:#fff}.rule:nth-child(6n+5){background:var(--c2);color:#fff}.rule:nth-child(6n){background:var(--c5);color:#fff}
.chip{font:700 13px Figtree,sans-serif;color:var(--tx);background:var(--card);border:2px solid var(--tx);border-radius:20px;padding:5px 12px;cursor:pointer}
.top{display:flex;justify-content:flex-end;padding-top:10px}
.ph{color:var(--mut);font-style:italic}
.big{display:inline-block;font:900 30px var(--hd);color:var(--tx);text-decoration:none;background:var(--sun);border-radius:40px;padding:10px 22px;box-shadow:3px 3px 0 var(--tx)}
.cin{color:var(--mut);font-size:13px;margin-top:10px}
@keyframes rise{from{transform:translateY(70px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:translateY(14px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.imp{background:var(--sun);color:#0e3b43;font-weight:800;border-radius:18px;padding:14px 16px;margin-bottom:14px;border:2px solid var(--tx)}
.cta.alt{background:var(--c2)}
.card p strong{font-weight:800}
</style></head><body><main id="app"></main>

it:{back:"← Indietro",wel:"Benvenuti a Jesolo",sub:"Istruzioni per il tuo arrivo e il soggiorno",maps:"Apri su Google Maps ›",call:"Chiama",soon:"Contenuto in arrivo.",
 s:{arr:"Il tuo arrivo",par:"Parcheggio e clima",rul:"Da ricordare",eat:"Dove mangiare",see:"Cosa vedere e trasporti",con:"Contatti"},
 arr:[["Raggiungete il Linden Park","La posizione da raggiungere è il cancello del Linden Park. Qui troverete l'ingresso della residenza.",1,1],
 ["Ritirate le chiavi","In fondo, dritti a voi, alla fine della stradina, nella zona campanelli a destra, a lato troverete un'unica casetta nera dove sono riposte le chiavi. Il codice è il codice che vi verrà fornito: assicuratevi che si richiuda correttamente. Col telecomando aprirete il cancello; all'entrata potete parcheggiare solo per il carico/scarico.",2],
 ["Salite all'appartamento","Percorrete il vialetto, superando la piscina. La scala da raggiungere è la n° 3, alla vostra destra. Aprite la porta condominiale e salite gli scalini: la porta è l'ultima a sinistra, interno 14.",3]],
 par:[["Parcheggio coperto","Il parcheggio coperto è dietro lo stabile: scendete la rampa e svoltate subito a destra, poco dopo sulla sinistra troverete quello con un'unità esterna di climatizzatore a terra (Rasera).",4],
 ["Climatizzatori","Nel mazzo c'è anche una piccola chiave: posizionatela all'entrata per attivare i climatizzatori, se ne avrete necessità."]],
 rul:[["☾","Silenzio","Rispettate gli orari di silenzio: 13–16 e 22–8."],["♪","Scale interne","Salite e scendete piano le scale, per evitare rimbombi."],["☂","Piscina","Chiudete sempre gli ombrelloni quando andate via."],["☀","Tenda da sole","Pulsante in terrazzo, in fondo vicino al clima: alzatela prima di uscire di casa."],["♻","Differenziata","I bidoni si trovano all'ingresso della stradina."],["🔑","Chiavi","Riponetele nella casetta nera, controllate che sia chiusa, poi scrollate i codici. Grazie!"]],
 bye:"Vi auguro una buona vacanza!"},
en:{back:"← Back",wel:"Welcome to Jesolo",sub:"Instructions for your arrival and stay",maps:"Open in Google Maps ›",call:"Call",soon:"Content coming soon.",
 s:{arr:"Your arrival",par:"Parking & A/C",rul:"Good to know",eat:"Where to eat",see:"What to see & transport",con:"Contact"},
 arr:[["Get to Linden Park","Head to the Linden Park gate. This is the entrance to the residence.",1,1],
 ["Collect the keys","At the end of the lane, straight ahead, next to the doorbells on the right, you'll find a single black box holding the keys. The code is the one we sent you: make sure it locks properly afterwards. Use the remote to open the gate; at the entrance you may park only to load/unload.",2],
 ["Go up to the apartment","Follow the path past the pool. Your stairwell is no. 3, on your right. Open the main door and go up the stairs: the door is the last on the left, apartment 14.",3]],
 par:[["Covered parking","The covered parking is behind the building: go down the ramp and turn right immediately; shortly after, on the left, you'll find the space with an outdoor A/C unit on the ground (Rasera).",4],
 ["Air conditioning","There's also a small key on the keyring: place it at the entrance to switch on the A/C if you need it."]],
 rul:[["☾","Quiet hours","Please respect quiet hours: 1–4 pm and 10 pm–8 am."],["♪","Stairs","Walk quietly on the stairs to avoid echoes."],["☂","Pool","Always close the umbrellas when you leave."],["☀","Awning","Button on the terrace, at the far end near the A/C: raise it before leaving the apartment."],["♻","Recycling","Bins are at the entrance of the lane."],["🔑","Keys","Put them back in the black box, check it's closed, then scramble the codes. Thank you!"]],
 bye:"Have a wonderful holiday!"},
de:{back:"← Zurück",wel:"Willkommen in Jesolo",sub:"Hinweise für Ihre Anreise und Ihren Aufenthalt",maps:"In Google Maps öffnen ›",call:"Anrufen",soon:"Inhalt folgt.",
 s:{arr:"Ihre Ankunft",par:"Parken & Klima",rul:"Gut zu wissen",eat:"Essen & Trinken",see:"Sehenswertes & Anreise",con:"Kontakt"},
 arr:[["Zum Linden Park fahren","Fahren Sie zum Tor des Linden Park. Hier befindet sich der Eingang zur Residenz.",1,1],
 ["Schlüssel abholen","Am Ende der kleinen Straße, geradeaus, neben den Klingeln rechts, finden Sie eine einzelne schwarze Box mit den Schlüsseln. Der Code ist der, den wir Ihnen mitgeteilt haben: Bitte prüfen Sie, dass sie wieder richtig schließt. Mit der Fernbedienung öffnen Sie das Tor; am Eingang dürfen Sie nur zum Be- und Entladen halten.",2],
 ["Zur Wohnung","Gehen Sie den Weg entlang am Pool vorbei. Ihr Treppenhaus ist Nr. 3, rechts von Ihnen. Öffnen Sie die Haustür und gehen Sie die Treppe hinauf: die Tür ganz links ist Wohnung 14.",3]],
 par:[["Überdachter Parkplatz","Der überdachte Parkplatz liegt hinter dem Gebäude: Fahren Sie die Rampe hinunter und biegen Sie sofort rechts ab; kurz danach links liegt der Stellplatz mit einem Klima-Außengerät am Boden (Rasera).",4],
 ["Klimaanlage","Am Schlüsselbund hängt auch ein kleiner Schlüssel: Stecken Sie ihn am Eingang ein, um die Klimaanlage bei Bedarf zu aktivieren."]],
 rul:[["☾","Ruhezeiten","Bitte beachten Sie die Ruhezeiten: 13–16 Uhr und 22–8 Uhr."],["♪","Treppenhaus","Gehen Sie leise die Treppe, um Hall zu vermeiden."],["☂","Pool","Schließen Sie die Sonnenschirme immer, wenn Sie gehen."],["☀","Markise","Schalter auf der Terrasse, hinten beim Klimagerät: Vor dem Verlassen der Wohnung einfahren."],["♻","Mülltrennung","Die Tonnen stehen am Eingang der Straße."],["🔑","Schlüssel","Zurück in die schwarze Box legen, prüfen, dass sie zu ist, dann die Codes verdrehen. Danke!"]],
 bye:"Einen schönen Urlaub!"}
,fr:{back:"← Retour",wel:"Bienvenue à Jesolo",sub:"Instructions pour votre arrivée et votre séjour",maps:"Ouvrir dans Google Maps ›",call:"Appeler",soon:"Contenu à venir.",
 s:{arr:"Votre arrivée",par:"Parking et clim",rul:"À retenir",eat:"Où manger",see:"À voir et transports",con:"Contact"},
 arr:[["Rejoignez le Linden Park","Rendez-vous au portail du Linden Park. C'est l'entrée de la résidence.",1,1],
 ["Récupérez les clés","Au fond, tout droit, au bout de la petite rue, près des sonnettes à droite, vous trouverez une unique boîte noire contenant les clés. Le code est celui que nous vous avons communiqué : vérifiez qu'elle se referme bien. La télécommande ouvre le portail ; à l'entrée, vous ne pouvez vous arrêter que pour charger/décharger.",2],
 ["Montez à l'appartement","Suivez l'allée en passant devant la piscine. Votre escalier est le n° 3, à votre droite. Ouvrez la porte de l'immeuble et montez : la porte tout au bout à gauche est l'appartement 14.",3]],
 par:[["Parking couvert","Le parking couvert est derrière le bâtiment : descendez la rampe et tournez tout de suite à droite ; peu après, sur la gauche, se trouve la place avec une unité extérieure de climatisation au sol (Rasera).",4],
 ["Climatisation","Une petite clé est aussi sur le trousseau : placez-la à l'entrée pour activer la climatisation si besoin."]],
 rul:[["☾","Silence","Merci de respecter les heures de silence : 13h–16h et 22h–8h."],["♪","Escaliers","Montez et descendez doucement pour éviter les résonances."],["☂","Piscine","Fermez toujours les parasols en partant."],["☀","Store","Bouton sur la terrasse, au fond près de la clim : relevez-le avant de quitter le logement."],["♻","Tri","Les bacs sont à l'entrée de la petite rue."],["🔑","Clés","Remettez-les dans la boîte noire, vérifiez qu'elle est fermée, puis brouillez les codes. Merci !"]],
 bye:"Je vous souhaite d'excellentes vacances !"}
,pl:{back:"← Wstecz",wel:"Witamy w Jesolo",sub:"Informacje o przyjeździe i pobycie",maps:"Otwórz w Google Maps ›",call:"Zadzwoń",soon:"Treść wkrótce.",
 s:{arr:"Twój przyjazd",par:"Parking i klimatyzacja",rul:"Warto pamiętać",eat:"Gdzie zjeść",see:"Co zobaczyć i dojazd",con:"Kontakt"},
 arr:[["Dojedź do Linden Park","Celem jest brama Linden Park. To wejście na teren rezydencji.",1,1],
 ["Odbierz klucze","Na końcu uliczki, prosto przed Wami, obok dzwonków po prawej, znajdziecie jedną czarną skrzynkę z kluczami. Kod to ten, który Wam przekazaliśmy: upewnijcie się, że skrzynka dobrze się zamyka. Pilotem otworzycie bramę; przy wjeździe można zatrzymać się tylko na załadunek/rozładunek.",2],
 ["Wejdź do apartamentu","Idźcie alejką, mijając basen. Wasza klatka to nr 3, po prawej stronie. Otwórzcie drzwi wejściowe i wejdźcie po schodach: ostatnie drzwi po lewej to apartament 14.",3]],
 par:[["Parking zadaszony","Parking zadaszony znajduje się za budynkiem: zjedźcie rampą i od razu skręćcie w prawo; chwilę dalej po lewej jest miejsce z zewnętrzną jednostką klimatyzacji na ziemi (Rasera).",4],
 ["Klimatyzacja","Na breloku jest też mały kluczyk: włóżcie go przy wejściu, aby w razie potrzeby uruchomić klimatyzację."]],
 rul:[["☾","Cisza","Prosimy o przestrzeganie godzin ciszy: 13–16 i 22–8."],["♪","Klatka schodowa","Chodźcie po schodach cicho, aby uniknąć echa."],["☂","Basen","Zawsze zamykajcie parasole, gdy wychodzicie."],["☀","Markiza","Przycisk na tarasie, na końcu przy klimatyzacji: zwińcie ją przed wyjściem z mieszkania."],["♻","Segregacja","Pojemniki stoją przy wejściu do uliczki."],["🔑","Klucze","Odłóżcie je do czarnej skrzynki, sprawdźcie, czy jest zamknięta, i przekręćcie kody. Dziękujemy!"]],
 bye:"Życzę udanych wakacji!"}
,pt:{back:"← Voltar",wel:"Bem-vindos a Jesolo",sub:"Instruções para a vossa chegada e estadia",maps:"Abrir no Google Maps ›",call:"Ligar",soon:"Conteúdo em breve.",
 s:{arr:"A vossa chegada",par:"Estacionamento e ar condicionado",rul:"A ter em conta",eat:"Onde comer",see:"O que ver e transportes",con:"Contacto"},
 arr:[["Cheguem ao Linden Park","O ponto a alcançar é o portão do Linden Park. É a entrada da residência.",1,1],
 ["Levantem as chaves","Ao fundo, em frente, no fim da ruela, junto às campainhas à direita, encontrarão uma única caixa preta onde estão guardadas as chaves. O código é o que vos foi enviado: certifiquem-se de que fecha bem. Com o comando abrem o portão; à entrada só podem parar para carregar/descarregar.",2],
 ["Subam ao apartamento","Sigam pelo caminho, passando a piscina. A escada a procurar é a n.º 3, à vossa direita. Abram a porta do prédio e subam: a porta ao fundo à esquerda é o apartamento 14.",3]],
 par:[["Estacionamento coberto","O estacionamento coberto fica atrás do edifício: desçam a rampa e virem logo à direita; pouco depois, à esquerda, encontrarão o lugar com uma unidade exterior de ar condicionado no chão (Rasera).",4],
